name: Bot package
on:
    push:
        paths:
            - "bot/**"

jobs:
    tsc:
        name: Run TSC
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
            - run: npm ci
            - run: npm run tsc --workspace bot
