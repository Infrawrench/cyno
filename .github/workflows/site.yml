name: Site package
on:
    push:
        paths:
            - "site/**"

jobs:
    tsc:
        name: Run TSC
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
            - run: npm ci
            - run: npm run tsc --workspace site

    lint:
        name: Run ESLint
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
            - run: npm ci
            - run: npm run lint --workspace site
